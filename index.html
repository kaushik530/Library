<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Library</title>
</head>
<body>
<header class="site-header">
    <div class="logo">
        Library
    </div>

    <nav class="nav">
        <a href="#">Home</a>
        <a href="#">My Books</a>
        <a href="#">Login</a>
    </nav>

    <div class="profile">
       <img src="images/octopus hybrid.png" class="profile-pic">
    </div>
</header>

<main>
    <div class="entry">
        <button class="addBook">Add Book</button>
    </div>

    <div class="bookEntry">
        <form class="bookForm">
            <input type="text" class="title">
            <input type="text" class="author">
            <input type="number" class="pages">

            <div class="readStatus">
                <span>Read?</span>
                <input type="checkbox" id="read">
            </div>

            <div class="formButtons">
                <button type="submit" class="submit">Submit</button>
                <button type="button" class="closeForm">Close</button>
            </div>
        </form>
    </div>

    <div class="bookGrid">
    </div>
</main>

<footer> The OdinProject@2026</footer>
</body>
</html>
